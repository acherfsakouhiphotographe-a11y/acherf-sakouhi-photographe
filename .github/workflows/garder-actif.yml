# =====================================================================
#  Garder le robot des notifications actif
#  GitHub met en pause les robots planifiés d'un dépôt public après 60 jours
#  sans commit. Celui-ci fait un petit commit le 1er de chaque mois.
# =====================================================================
name: Garder les notifications actives

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Écrire la date et commiter
        run: |
          date -u +"Dernière activité automatique : %Y-%m-%d %H:%M UTC" > .github/derniere-activite.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/derniere-activite.txt
          git diff --staged --quiet && exit 0
          git commit -m "Garder les robots planifiés actifs"
          git push
